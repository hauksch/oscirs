name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # xmllint validates captured OSCI traffic against the normative
      # schemas (xsd_gate test); python3-lxml drives the gate script
      - name: Install schema-gate tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils python3-lxml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # oracle-gated differential tests skip gracefully when the pinned
      # Java reference/oracle is absent (see scripts/build-oracle.sh);
      # the XSD gate validates composed messages against the vendored
      # 2.6.1 schema set.
      - run: cargo test --workspace
