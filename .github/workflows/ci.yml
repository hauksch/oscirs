name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # xmllint validates captured OSCI traffic against the normative
      # schemas (xsd_gate test); python3-lxml drives the gate script
      - name: Install schema-gate tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils python3-lxml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # oracle-gated differential tests skip gracefully when the pinned
      # Java reference/oracle is absent (see scripts/build-oracle.sh);
      # the XSD gate validates composed messages against the vendored
      # 2.6.1 schema set.
      - run: cargo test --workspace
