name: audit

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so new RustSec advisories surface without commit activity.
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-deny
      # advisories (RustSec vulnerabilities + yanked), licenses, bans,
      # sources — with every feature enabled, matching the real graph.
      - run: cargo deny --all-features check --hide-inclusion-graph
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
