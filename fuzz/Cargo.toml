[package]
name = "osci-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
osci-core = { path = "../crates/osci-core" }

[[bin]]
name = "mime_parser"
path = "fuzz_targets/mime_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml_parse"
path = "fuzz_targets/xml_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "c14n"
path = "fuzz_targets/c14n.rs"
test = false
doc = false
bench = false

[[bin]]
name = "base64"
path = "fuzz_targets/base64.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
