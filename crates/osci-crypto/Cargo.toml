[package]
name = "osci-crypto"
description = "OSCI-Transport 1.2 crypto SPI (Signer/Decrypter) and software implementation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.9"
base64 = "0.23.1"
cbc = "0.2"
chrono = "0.4.45"
ctr = "0.10"
des = "0.9"
ghash = "0.6"
p256 = "0.14"
p384 = "0.14"
rand = "0.10"
ripemd = { version = "0.2", features = ["oid"] }
rsa = { version = "0.9.10", features = ["sha2"] }
sha1 = { version = "0.11", features = ["oid"] }
sha3 = "0.12"
thiserror = "2.0.21"
x509-parser = "0.18.1"

[dev-dependencies]
test-utils = { path = "../test-utils" }
aes-gcm = "0.11"
osci-core = { path = "../osci-core" }
proptest = "1.12.0"
