[package]
name = "osci-crypto"
description = "OSCI-Transport 1.2 crypto SPI (Signer/Decrypter) and software implementation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.8"
base64 = "0.23.1"
cbc = "0.1"
chrono = "0.4.45"
ctr = "0.9"
des = "0.8"
ghash = "0.5"
p256 = "0.13"
p384 = "0.13"
rand = "0.8"
ripemd = { version = "0.1", features = ["oid"] }
rsa = { version = "0.9.10", features = ["sha2"] }
sha1 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
thiserror = "2.0.21"
x509-parser = "0.18.1"

[dev-dependencies]
aes-gcm = "0.10"
osci-core = { path = "../osci-core" }
proptest = "1.12.0"
