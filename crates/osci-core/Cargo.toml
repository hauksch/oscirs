[package]
name = "osci-core"
description = "OSCI-Transport 1.2 message model, SOAP/XML codec, MIME and helper layer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
osci-crypto = { path = "../osci-crypto" }
quick-xml = "0.42.0"
rand = "0.8"
thiserror = "2"

[dev-dependencies]
test-utils = { path = "../test-utils" }
base64 = "0.23.1"
proptest = "1.12.0"
serde_json = "1.0.154"
