[package]
name = "osci-core"
description = "OSCI-Transport 1.2 message model, SOAP/XML codec, MIME and helper layer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rand = "0.8"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
base64 = "0.23.1"
