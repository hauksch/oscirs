[package]
name = "osci-core"
description = "OSCI-Transport 1.2 message model, SOAP/XML codec, MIME and helper layer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
quick-xml = "0.42.0"
rand = "0.8"
ripemd = "0.2.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
base64 = "0.23.1"
proptest = "1.12.0"
serde_json = "1.0.154"
