[package]
name = "osci"
description = "OSCI-Transport 1.2 client library facade: DialogHandler, roles, dialogs and messages"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
osci-core = { path = "../osci-core" }
osci-crypto = { path = "../osci-crypto" }
osci-transport = { path = "../osci-transport" }
rand = "0.8"
thiserror = "2.0.21"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
test-utils = { path = "../test-utils" }
