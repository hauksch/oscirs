[workspace]
resolver = "3"
members = [
  "crates/osci",
  "crates/osci-core",
  "crates/osci-crypto",
  "crates/osci-samples",
  "crates/osci-transport",
  "crates/test-utils",
]
# fuzz/ is a separate cargo workspace (cargo-fuzz layout)
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
debug = true
