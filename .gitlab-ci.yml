stages: [check, test, audit, oracle]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-cache

rust-check:
  stage: check
  image: rust:1.98-slim
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all --check
    - cargo clippy --locked --workspace --all-targets -- -D warnings
  cache:
    key: rust-check
    paths: [.cargo-cache/registry, target/]

rust-test:
  stage: test
  image: rust:1.98-slim
  script:
    - cargo test --locked --workspace
  cache:
    key: rust-test
    paths: [.cargo-cache/registry, target/]

# Issue #3 gate: composed wire traffic validates against the normative
# OSCI schemas (scripts/xsd-validate.sh; the cargo gate skips silently
# when the validator is absent, this job makes it authoritative in CI).
xsd-validate:
  stage: test
  image: rust:1.98-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3-minimal python3-lxml
    # the gate silently skips when the validator import fails - fail the
    # job instead of passing green with zero validations
    - python3 -c "import lxml"
  script:
    - cargo test --locked -p osci --test xsd_gate -- --nocapture
  cache:
    key: xsd-validate
    paths: [.cargo-cache/registry, target/]

# Dependency audit: known-vulnerability check against the committed
# lockfile. Tool version pinned; RUSTSEC-2023-0071 (rsa Marvin) is a
# documented accepted risk for the legacy v1.5 interop path.
dependency-audit:
  stage: audit
  image: rust:1.98-slim
  allow_failure: true
  script:
    - cargo install cargo-audit --version 0.21.2 --locked --quiet
    # allow_failure: true already makes this non-blocking; without the
    # dropped || true even tool-level failures would pass green
    - cargo audit --locked
  cache:
    key: audit
    paths: [.cargo-cache/registry]

# Differential testing against the pinned Java reference (tag 2.6.1):
# build the reference, extract the corpus, compile the oracle harness and
# run the full workspace suite (oracle-dependent tests auto-enable).
oracle-test:
  stage: oracle
  image: rust:1.98-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless maven openssl
  script:
    - ./scripts/fetch-reference.sh
    - cd reference/osci-bib-java && mvn -B verify; cd ../..
    - ./scripts/extract-testcorpus.sh
    - ./scripts/build-oracle.sh
    - OSCI_JAVA=/usr/bin/java cargo test --locked --workspace
  cache:
    key: oracle-test
    paths: [.cargo-cache/registry, target/, reference/]
